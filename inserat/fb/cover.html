<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>
:root{--ink:#11251e;--lime:#d9ed8b}*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--ink);font-family:Inter,Arial,sans-serif;color:#fff}
.ph{position:absolute;right:0;top:0;width:55vw;height:100vh;background:url(luft.jpg) center/cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0,rgba(17,37,30,0) 40%)}
.t{position:absolute;left:22vw;top:50%;transform:translateY(-50%);width:45vw}
.k{font-size:1.6vw;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
h1{font-size:5.1vw;line-height:1;letter-spacing:-.035em;font-weight:850;margin-top:.9vw}
h1 span{color:var(--lime)}
.s{font-size:1.75vw;font-weight:650;margin-top:1.4vw;color:#eef4ef}
.u{font-size:2.1vw;font-weight:850;margin-top:1.8vw;color:var(--lime)}
</style></head><body><div class="ph"></div><div class="t">
<p class="k">Privatverkauf · ohne Makler</p>
<h1>5.097 m²<br><span>Gewerbegrund.</span></h1>

<p class="u">gewerbegrund.info</p></div></body></html>
